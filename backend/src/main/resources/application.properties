spring.datasource.url=jdbc:mysql://localhost:3306/dormitory_management
spring.datasource.username=root
spring.datasource.password=admin123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Include exception messages (e.g. "Room number already exists") in error responses so the frontend can show them
server.error.include-message=always

# First admin account, created on startup only when no admin exists yet.
# Development default: override with environment variables APP_BOOTSTRAP_ADMIN_EMAIL /
# APP_BOOTSTRAP_ADMIN_PASSWORD on any shared or deployed server.
app.bootstrap.admin.email=admin@dormisync.local
app.bootstrap.admin.password=admin123
app.bootstrap.admin.first-name=System
app.bootstrap.admin.last-name=Administrator
